name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint · import · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uvx ruff@0.15.17 check eyebrowse examples

      - name: Import smoke test
        run: >
          uv run python -c "import eyebrowse;
          from eyebrowse import EyeBrowse;
          from eyebrowse.mcp import server;
          print('import OK', eyebrowse.__version__)"

      - name: Build wheel + sdist
        run: uv build

      - name: Verify the MCP entry point is registered
        run: >
          uv run python -c "import importlib.metadata as m;
          names=[e.name for e in m.entry_points(group='console_scripts')];
          assert 'eyebrowse-mcp' in names, names;
          print('entry point OK: eyebrowse-mcp')"
