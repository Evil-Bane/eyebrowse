name: Publish to PyPI

# Manual, opt-in release. One-time setup before the first run:
#   PyPI -> Account -> Publishing -> add a Trusted Publisher for this repo
#   (owner: Evil-Bane, repo: eyebrowse, workflow: publish.yml, environment: pypi).
# After that no API token is needed — release is authenticated via OIDC.
# Bump the version in pyproject.toml + eyebrowse/__init__.py first, then run this
# workflow from the Actions tab (or `gh workflow run "Publish to PyPI"`).

on:
  workflow_dispatch:

jobs:
  pypi:
    name: build · publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/eyebrowse/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: uv build

      - name: Publish (trusted publishing, skips files already on PyPI)
        run: uv publish --check-url https://pypi.org/simple/eyebrowse/
